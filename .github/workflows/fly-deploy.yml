# Deploys My Budget to Fly.io.
#
# On each run this workflow will, in order:
#   1. Create the Fly app named in fly.toml (if it doesn't exist yet)
#   2. Create the "budget_data" persistent volume (if it doesn't exist yet)
#   3. Deploy the latest code
#
# This makes the very first run a complete, one-click setup — and every
# later run a normal deploy (steps 1-2 just say "already exists").
#
# Requires a repository secret named FLY_API_TOKEN (see README / DEPLOY.md).
name: Deploy to Fly.io

on:
  push:
    branches:
      - claude/wonderful-bohr-7lsp5c
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

# Never run two deploys at once (and don't cancel one mid-deploy).
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read app name and region from fly.toml
        id: cfg
        run: |
          APP=$(grep -E '^app[[:space:]]*=' fly.toml | head -1 | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          REGION=$(grep -E '^primary_region[[:space:]]*=' fly.toml | head -1 | sed -E 's/^[^"]*"([^"]*)".*/\1/')
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "Using app '$APP' in region '$REGION'"

      - name: Create app if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl status --app "${{ steps.cfg.outputs.app }}" >/dev/null 2>&1; then
            echo "App '${{ steps.cfg.outputs.app }}' already exists."
          else
            echo "Creating app '${{ steps.cfg.outputs.app }}'..."
            flyctl apps create "${{ steps.cfg.outputs.app }}" --org personal
          fi

      - name: Create data volume if it doesn't exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list --app "${{ steps.cfg.outputs.app }}" 2>/dev/null | grep -q budget_data; then
            echo "Volume 'budget_data' already exists."
          else
            echo "Creating volume 'budget_data' in ${{ steps.cfg.outputs.region }}..."
            flyctl volumes create budget_data \
              --app "${{ steps.cfg.outputs.app }}" \
              --region "${{ steps.cfg.outputs.region }}" \
              --size 1 --yes
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false
