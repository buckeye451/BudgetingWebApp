# Auto-deploy to Fly.io on every push to the default branch.
# Requires a repository secret named FLY_API_TOKEN (see README).
name: Deploy to Fly.io

on:
  push:
    branches:
      - claude/wonderful-bohr-7lsp5c
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

# Never run two deploys at once.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
